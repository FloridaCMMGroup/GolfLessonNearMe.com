name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1e43c1ed4f1ee94730ce36fccf3d752b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
            exit 0
          fi
          mkdir -p /tmp/out
          rsync -a --exclude='.git' --exclude='.github' --exclude='functions' --exclude='README.md' --exclude='CHANGELOG.md' --exclude='redirects.csv' --exclude='images/README.txt' ./ /tmp/out/
          npx -y wrangler@4 pages deploy /tmp/out --project-name=golflessonnearme --branch=main --commit-dirty=true
